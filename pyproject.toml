[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# evorthon-implements: EVD-README-033
name = "evorthon-data"
version = "1.0.1"
description = "End-to-end data-platform delivery coworker for modernising an existing estate or building a new one"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
# This is the sole owner of the delivery version ranges. Each entry declares a
# floor and no ceiling: the floor is the first published version that carries an
# interface the product calls, rising only when the code calls a newer one. The
# base package stays portable without a tracker, build runner, or generator.
delivery = [
  "pinax-tracker>=0.1.3",
  "autobuild-factory>=0.5.0",
  "ergasterion-factory>=0.6.1",
]
# The generated public candidate installs this extra to run its own test suite.
test = ["pytest>=8,<9", "pytest-timeout>=2,<3"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-timeout>=2,<3"]

[project.scripts]
evorthon-data = "evorthon_data.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evorthon_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-q -m "not deep"'
markers = ["deep: clean-install and projection checks"]
timeout = 60
timeout_method = "thread"
